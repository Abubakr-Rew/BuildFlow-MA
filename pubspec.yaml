name: buildflow
description: "BuildFlow — Daily photo reports for construction sites"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Networking (uploads and downloads of Storage files with progress)
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Platform: opens the app's system settings after a refused permission
  app_settings: ^9.0.1

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1

  # Voice messages: recording (AAC in M4A) and playback
  record: ^7.1.2
  audioplayers: ^6.8.1

  # Backend: Auth, RPC, Storage, Realtime and Edge Functions of Supabase.
  # http for its ClientException (network errors) and MockClient in tests.
  supabase_flutter: ^2.18.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^4.0.0
  json_serializable: ^6.9.0
  # Generates the launcher icons; not part of the app
  flutter_launcher_icons: 0.14.4

# After a change in assets/icon/: dart run flutter_launcher_icons, then
# git checkout -- ios/Runner.xcodeproj/project.pbxproj (the package breaks it, and it needs no change)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  # Background of app_icon.png. The mark takes 40 % of the foreground layer, so round launcher
  # masks don't cut it; the default inset (16 %) would shrink it to 27 %.
  adaptive_icon_background: "#F4F2EE"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Registered in main.dart, so the license ships with the fonts.
    - assets/fonts/inter/OFL.txt

  # Inter 4.1 (https://github.com/rsms/inter), static weights used by the app.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
